<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SpecCraft Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 23 23'%3E%3Crect width='7' height='7' fill='%23ece7db'/%3E%3Crect x='8' width='7' height='7' fill='%23ece7db'/%3E%3Crect x='8' y='8' width='7' height='7' fill='%237d97ff'/%3E%3Crect y='16' width='7' height='7' fill='%23ece7db'/%3E%3Crect x='16' y='16' width='7' height='7' fill='%23ece7db'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Collapse or expand the sidebar" title="Collapse or expand the sidebar ( [ )">
          <svg class="when-open" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5"/><path d="M6 2.75v10.5M10.5 6L8.5 8l2 2"/></svg>
          <svg class="when-closed" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5"/><path d="M6 2.75v10.5M8.5 6l2 2-2 2"/></svg>
        </button>
        <nav class="crumbs" id="crumbs"></nav>
        <div class="spacer"></div>
        <div class="top-live" id="topLive"></div>
        <span class="label" id="updated"></span>
        <button class="icon-btn chat-btn" id="chatBtn" aria-label="Agent chat" title="Agent chat ( ] )">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 3.25h11v7.5h-6.5l-3 2.5v-2.5h-1.5z"/><path d="M5 6.25h6M5 8.25h4"/></svg>
        </button>
      </header>
      <main class="page" id="page"><div class="label">Loading…</div></main>
    </div>
    <aside class="chat" id="chat" aria-label="Agent chat"></aside>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
