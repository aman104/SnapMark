name: SnapMark CI

on:
  push:
    branches: [main, 'milestone/**', 'task/**']
  pull_request:
    branches: [main]

jobs:
  verify-and-package:
    name: Typecheck, Unit Tests, Build, E2E & Web Store Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run unit & integration tests (Vitest)
        run: npm test

      - name: Build Manifest V3 extension (./dist)
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E extension verification suite
        run: npm run test:e2e

      - name: Package Chrome Web Store ZIP archive
        run: npm run package
